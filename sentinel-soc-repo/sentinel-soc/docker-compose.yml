version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: sentinel-soc-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./backend/data:/app/data
      - ./sample_data:/sample_data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    container_name: sentinel-soc-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
